# Only enabled baseline models; native vendor runtime and drivers are kept.
node: nano
role: edge
runtime: ollama
endpoint: http://localhost:11434
bind: localhost
context: 4096
request_timeout: 300
unload_timeout_seconds: 60
edge_models:
  nano/qwen3.5-4b:
    id: qwen3.5:4b
    context: 4096
    target_context: 16384
    think: false
retire_models: []
calibration:
  contexts:
  - 2048
  - 4096
  - 8192
  - 16384
  - 32768
  min_host_free_mib: 512
  min_generation_tps: 3
  max_request_seconds: 300
prune_native_models: true
