# RTX A4500 20 GiB; Sandy Bridge Xeons have AVX but NO AVX2.
node: z820
role: worker
hardware:
  vendor: "0x10de"
  pci_device: "0x2232"
  device_regex: "A4500|NVIDIA"
  backends: [cuda, cuda-native]
  telemetry: nvidia_smi
  cuda_arch: 86
  gpu_name_regex: A4500
backend: cuda                         # cuda-native = build with local CUDA toolkit, native CPU flags
bind: tailnet                       # encrypted cluster traffic
port: 8081
legacy_service: ollama.service
migration_hostnames: []  # optional exact hostname allowlist; empty permits any matching hardware
reserve_gib: 15
ollama_store: /usr/share/ollama/.ollama/models
# Context is the deployable starting value; --calibrate --apply updates it.
calibration:
  contexts: [8192, 16384, 32768, 65536, 131072, 262144]
  cache_types: [f16, q8_0, q4_0]  # highest precision meeting target wins
  min_host_free_gib: 6
  min_gpu_free_mib: 1024
  min_generation_tps: 5
  max_ttft_seconds: 300
  request_timeout_seconds: 1800
  trials: 3
# context is per request slot; total KV pool = context × parallel.
resident_groups: []  # optional lists of model IDs; validate combined memory before using
models:
  z820/gpt-oss-20b-mxfp4:
    source:
      repo: ggml-org/gpt-oss-20b-GGUF
      revision: 15dcfc7e7c608c6161507211ed43c5b590801b4b
      files: [gpt-oss-20b-MXFP4.gguf]
    parallel: 1
    tool_test: true
    test_request: {reasoning_effort: low}
    context: 16384
    target_context: 65536  # calibration goal, not guaranteed fit
    cache_type_k: f16  # safe starting value; calibrate to tune
    cache_type_v: f16
    flash_attention: auto
  z820/qwen3.8-27b-ud-iq4_xs:
    source:
      repo: unsloth/Qwen3.8-27B-GGUF
      revision: db81afd1e1f5d6cca1988c9fe5c8fe0844b1cad7
      files: [Qwen3.8-27B-UD-IQ4_XS.gguf]
    parallel: 1
    tool_test: true
    test_request: {chat_template_kwargs: {enable_thinking: false}}
    context: 8192                    # increase only after VRAM measurement
    target_context: 32768  # calibration goal, not guaranteed fit
    cache_type_k: f16  # safe starting value; calibrate to tune
    cache_type_v: f16
    flash_attention: auto


# Seed cleanup: dedicated inventoried inference paths, never OS drivers.
legacy_cleanup:
  services: [ollama.service, llama-swap.service]
  directories:
    - /usr/share/ollama/.ollama/models
    - /usr/local/lib/ollama
  files: [/usr/local/bin/ollama, /usr/local/bin/llama-swap, ~/llama-swap.yaml]

# Runtime and available models per cluster mode. YAML anchors share identical selections.
modes:
  general: &general
    runtime: llm
    catalog: standard
    models:
      - z820/gpt-oss-20b-mxfp4
      - z820/qwen3.8-27b-ud-iq4_xs
  general-abliterated: &alternate
    runtime: llm
    catalog: abliterated
    models:
      - z820/qwen3.8-27b-heretic-i1-iq4_xs
  video:
    runtime: comfyui
    bundles: [wan22-production]
    models:
      - vae/wan_2.1_vae.safetensors
      - text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
      - diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
      - diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
      - diffusion_models/wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors
      - diffusion_models/wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors
      - loras/wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
      - loras/wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
      - loras/wan2.2_t2v_lightx2v_4steps_lora_v1.1_high_noise.safetensors
      - loras/wan2.2_t2v_lightx2v_4steps_lora_v1.1_low_noise.safetensors
  video-abliterated:
    runtime: comfyui
    bundles: [wan22-community]
    models:
      - vae/wan_2.1_vae.safetensors
      - text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
      - diffusion_models/Wan2.2_I2V_High_R1.safetensors
      - diffusion_models/Wan2.2_I2V_Low_R1.safetensors
      - diffusion_models/wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors
      - diffusion_models/wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors
      - loras/wan2.2_t2v_lightx2v_4steps_lora_v1.1_high_noise.safetensors
      - loras/wan2.2_t2v_lightx2v_4steps_lora_v1.1_low_noise.safetensors
