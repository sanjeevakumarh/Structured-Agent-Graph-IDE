# RTX A4500 20 GiB; Sandy Bridge Xeons have AVX but NO AVX2.
node: z820
role: worker
hardware:
  vendor: "0x10de"
  device_regex: "A4500|NVIDIA"
  backends: [cuda, cuda-native]
  telemetry: nvidia_smi
  cuda_arch: 86
  gpu_name_regex: A4500
backend: cuda                         # cuda-native = build with local CUDA toolkit, native CPU flags
bind: localhost                       # use tailnet for encrypted remote access (or local-only)
port: 8081
legacy_service: ollama.service
migration_hostnames: []  # optional exact hostname allowlist; empty permits any matching hardware
reserve_gib: 15
ollama_store: /usr/share/ollama/.ollama/models
# Context is the deployable starting value; --calibrate --apply updates it.
calibration:
  contexts: [8192, 16384, 32768, 65536, 131072, 262144]
  cache_types: [f16, q8_0, q4_0]  # highest precision meeting target wins
  min_host_free_gib: 6
  min_gpu_free_mib: 1024
  min_generation_tps: 5
  max_ttft_seconds: 300
  request_timeout_seconds: 1800
  trials: 3
# context is per request slot; total KV pool = context × parallel.
resident_groups: []  # optional lists of model IDs; validate combined memory before using
models:
  z820/gpt-oss-20b-mxfp4:
    source:
      repo: ggml-org/gpt-oss-20b-GGUF
      revision: 15dcfc7e7c608c6161507211ed43c5b590801b4b
      files: [gpt-oss-20b-MXFP4.gguf]
    parallel: 1
    tool_test: true
    test_request: {reasoning_effort: low}
    context: 16384
    target_context: 65536  # calibration goal, not guaranteed fit
    cache_type_k: f16  # safe starting value; calibrate to tune
    cache_type_v: f16
    flash_attention: auto
  z820/qwen3.8-27b-ud-iq4_xs:
    source:
      repo: unsloth/Qwen3.8-27B-GGUF
      revision: db81afd1e1f5d6cca1988c9fe5c8fe0844b1cad7
      files: [Qwen3.8-27B-UD-IQ4_XS.gguf]
    parallel: 1
    tool_test: true
    test_request: {chat_template_kwargs: {enable_thinking: false}}
    context: 8192                    # increase only after VRAM measurement
    target_context: 32768  # calibration goal, not guaranteed fit
    cache_type_k: f16  # safe starting value; calibrate to tune
    cache_type_v: f16
    flash_attention: auto

legacy_cleanup:
  ollama_tags: ['gpt-oss:20b', 'qwen3.8:27b-q4_K_M', 'gemma4:26b-a4b-it-q4_K_M', 'nomic-embed-text:latest', 'hf.co/unsloth/Qwen3.8-27B-GGUF:UD-IQ4_XS']
