# Arc Pro B70. Xe driver/Level Zero already installed; don't replace drivers.
node: p520
role: worker
hardware:
  vendor: "0x8086"
  device_regex: "Intel|BMG|Arc"
  backends: [vulkan, sycl]
  telemetry: intel_xpu
  intel_device: 0
backend: vulkan                       # sycl = benchmark candidate; requires compatible oneAPI libs
bind: localhost                       # use tailnet for encrypted remote access (or local-only)
port: 8081
legacy_service: llama-swap.service
migration_hostnames: []  # optional exact hostname allowlist; empty permits any matching hardware
reserve_gib: 15
# Context is the deployable starting value; --calibrate --apply updates it.
calibration:
  contexts: [8192, 16384, 32768, 65536, 131072, 262144]
  cache_types: [f16, q8_0, q4_0]  # highest precision meeting target wins
  min_host_free_gib: 6
  min_gpu_free_mib: 1024
  min_generation_tps: 5
  max_ttft_seconds: 300
  request_timeout_seconds: 1800
  trials: 3
# context is per request slot; total KV pool = context × parallel.
resident_groups: []  # optional lists of model IDs; validate combined memory before using
models:
  p520/qwen3.8-27b-ud-q5_k_m:
    source:
      repo: unsloth/Qwen3.8-27B-GGUF
      revision: db81afd1e1f5d6cca1988c9fe5c8fe0844b1cad7
      files: [Qwen3.8-27B-UD-Q5_K_M.gguf]
      reuse: ~/models/Qwen3.8-27B-GGUF
    parallel: 1
    tool_test: true
    test_request: {chat_template_kwargs: {enable_thinking: false}}
    context: 32768
    target_context: 65536  # calibration goal, not guaranteed fit
    cache_type_k: f16  # safe starting value; calibrate to tune
    cache_type_v: f16
    flash_attention: auto
  p520/qwen3.6-35b-a3b-ud-q4_k_xl:
    source:
      repo: unsloth/Qwen3.6-35B-A3B-GGUF
      revision: 9280dd353ab587157920d5bd391ada414d84e552
      files: [Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf]
      reuse: ~/models/Qwen3.6-35B-A3B-GGUF
    parallel: 1
    tool_test: true
    test_request: {chat_template_kwargs: {enable_thinking: false}}
    context: 32768
    target_context: 65536  # calibration goal, not guaranteed fit
    cache_type_k: f16  # safe starting value; calibrate to tune
    cache_type_v: f16
    flash_attention: auto
  p520/gemma-4-26b-a4b-ud-q4_k_xl:
    # Optional: verify projector compatibility and exact file at the pinned revision.
    source:
      repo: unsloth/gemma-4-26B-A4B-it-GGUF
      revision: 4778d63c081b7500e303153d00883d5109ca12c0
      files: [gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf, mmproj-F16.gguf]
      reuse: ~/models/gemma-4-26B-A4B-it-GGUF
    parallel: 1
    tool_test: true
    test_request: {}
    context: 16384
    target_context: 32768  # calibration goal, not guaranteed fit
    cache_type_k: f16  # safe starting value; calibrate to tune
    cache_type_v: f16
    flash_attention: auto
    enabled: false

# Preserve optional vision weights/projectors; retire superseded text models.
legacy_cleanup:
  runtime_dirs: [~/llama-vulkan]
  model_files:
    - ~/models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
    - ~/models/gpt-oss-20b-GGUF/gpt-oss-20b-MXFP4.gguf
    - ~/models/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
    - ~/models/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q5_K_M.gguf
