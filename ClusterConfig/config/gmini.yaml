# EVO-X2 / gfx1151 / 112 GiB GTT. Keep OS, ROCm 7.2.1 and GTT settings intact.
node: gmini
role: worker
hardware:
  vendor: "0x1002"
  pci_device: "0x1586"  # Ryzen AI MAX+ 395 integrated graphics; adjust if hardware changes
  device_regex: "AMD|Radeon|gfx1151"
  backends: [vulkan, rocm]
  telemetry: amd_gtt
  rocm_target: gfx1151
backend: vulkan                       # rocm = native build against installed ROCm
bind: tailnet                       # encrypted cluster traffic
port: 8081                            # staging; 8080 SearXNG, 11434 legacy Ollama
legacy_service: ollama.service
migration_hostnames: []  # optional exact hostname allowlist; empty permits any matching hardware
reserve_gib: 15
ollama_store: /usr/share/ollama/.ollama/models
# Pinned upstream GGUFs; only byte-identical local files can be reused.
# Context is the deployable starting value; --calibrate --apply updates it.
calibration:
  contexts: [8192, 16384, 32768, 65536, 131072, 262144]
  cache_types: [f16, q8_0, q4_0]  # highest precision meeting target wins
  min_host_free_gib: 6
  min_gpu_free_mib: 1024
  min_generation_tps: 5
  max_ttft_seconds: 300
  request_timeout_seconds: 1800
  trials: 3
# context is per request slot; total KV pool = context × parallel.
resident_groups: []  # optional lists of model IDs; validate combined memory before using
models:
  gmini/qwen3-coder-next-80b-q4_k_m:
    source:
      repo: unsloth/Qwen3-Coder-Next-GGUF
      revision: 3c43105b7199f5005fd64c4d5426c0da88e91335
      files: [Qwen3-Coder-Next-Q4_K_M.gguf]
    parallel: 2
    tool_test: true
    test_request: {}
    context: 32768
    target_context: 131072  # calibration goal, not guaranteed fit
    cache_type_k: f16  # safe starting value; calibrate to tune
    cache_type_v: f16
    flash_attention: auto
  gmini/gpt-oss-120b-mxfp4:
    source:
      repo: ggml-org/gpt-oss-120b-GGUF
      revision: 7200b74bea78b0a2964ef9f3897eefa401e890ff
      files: [gpt-oss-120b-MXFP4.gguf]
    parallel: 1
    tool_test: true
    test_request: {reasoning_effort: low}
    context: 32768
    target_context: 65536  # calibration goal, not guaranteed fit
    cache_type_k: f16  # safe starting value; calibrate to tune
    cache_type_v: f16
    flash_attention: auto
  gmini/qwen3.6-35b-a3b-ud-q4_k_m:
    source:
      repo: unsloth/Qwen3.6-35B-A3B-GGUF
      revision: 4a3a39659678d382ccdb388bced90e5a711cd5ea
      files: [Qwen3.6-35B-A3B-UD-Q4_K_M.gguf]
    parallel: 2
    tool_test: true
    test_request: {chat_template_kwargs: {enable_thinking: false}}
    context: 32768
    target_context: 131072  # calibration goal, not guaranteed fit
    cache_type_k: f16  # safe starting value; calibrate to tune
    cache_type_v: f16
    flash_attention: auto

# Seed cleanup: dedicated inventoried inference paths, never OS drivers.
legacy_cleanup:
  services: [ollama.service, llama-swap.service]
  directories:
    - ~/models
    - ~/llama-rocm
    - ~/llama-vulkan-gmini
    - /usr/share/ollama/.ollama/models
    - /usr/local/lib/ollama
  files: [/usr/local/bin/ollama, /usr/local/bin/llama-swap, ~/llama-swap.yaml]
